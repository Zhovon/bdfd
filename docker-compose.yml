services:
  db:
    image: postgres:16-alpine
    container_name: annapurna_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna_dev
      POSTGRES_DB: annapurna
    ports:
      - "5433:5432"
    volumes:
      - annapurna_pgdata:/var/lib/postgresql/data

volumes:
  annapurna_pgdata:
